server {
  listen 8080;
  root /usr/share/nginx/html;

  resolver 8.8.8.8 valid=300s;

  location = /api/now-playing {
    set $spotify_card spotify-github-profile.kittinanx.com;
    proxy_pass https://$spotify_card/api/view?uid=31xpxag2vrv2jhiufbogqwf56b6a&cover_image=false&theme=novatorem&show_offline=true;
    proxy_set_header Host $spotify_card;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "public, max-age=20";
  }

  location = /api/last-played {
    set $spotify_card spotify-github-profile.kittinanx.com;
    proxy_pass https://$spotify_card/api/view?uid=31xpxag2vrv2jhiufbogqwf56b6a&cover_image=false&theme=novatorem&show_offline=false;
    proxy_set_header Host $spotify_card;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "public, max-age=20";
  }

  location / {
    try_files $uri /index.html;
  }
}
